name: Release checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'quay.io/localbyte/cato' }}
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      CATO_E2E_RESULTS: /tmp/cato-e2e-results
      # Shared runners are slower than a dev machine: double the timing
      # budgets of the production-shaped performance test.
      CATO_PERF_SLACK: '2'
    steps:
      # A tag on a commit that already passed on main reuses that run: the
      # checks are skipped, while the image, scan, signature and deploy run.
      - name: Reuse a green main run of this commit
        id: reuse
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success" --jq '.total_count')
          if [ "$runs" -gt 0 ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_SHA already passed on main; skipping the checks."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.reuse.outputs.green != 'true'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.reuse.outputs.green != 'true'
        with:
          go-version: '1.26.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.reuse.outputs.green != 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install browser system dependencies
        if: steps.reuse.outputs.green != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          npm --prefix e2e ci
          cd e2e && npx playwright install --with-deps chromium webkit firefox
      - name: Validate release
        if: steps.reuse.outputs.green != 'true'
        run: make release-check
      - name: Browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: /tmp/cato-e2e-results
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  image:
    needs: [release, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify release tag belongs to main before publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$IMAGE_REPOSITORY" =~ ^quay\.io/[a-z0-9_-]+/[a-z0-9_.-]+$ ]]
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Quay
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build from source (publish only on tag push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-sign:
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Scan amd64 image from this build's immutable digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ needs.image.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan arm64 image from this build's immutable digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ needs.image.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign this build's digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REPOSITORY@$IMAGE_DIGEST"

  github-release:
    needs: [image, scan-sign]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          printf 'Container image: `%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes-file /tmp/release-notes.md

  deploy:
    needs: [image, scan-sign, github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: cato-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Verify the digest was signed by this repository's release workflow
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}" \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST" > /dev/null
      - name: Install optional Cloudflare Access SSH proxy
        if: vars.DEPLOY_CLOUDFLARE_ACCESS == 'true'
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.1.2/cloudflared-linux-amd64 -o /tmp/cloudflared
          echo 'e157c54e929cc289cbd53860453168c2fe3439eb55e2e965a56579252585d9c1  /tmp/cloudflared' | sha256sum -c -
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
      - name: Back up and deploy the signed digest
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_CLOUDFLARE_ACCESS: ${{ vars.DEPLOY_CLOUDFLARE_ACCESS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # The host's .env, rendered by deploy-remote.sh (unset ones are left out).
          CATO_BASE_URL: ${{ vars.CATO_BASE_URL }}
          CATO_TRUSTED_PROXIES: ${{ vars.CATO_TRUSTED_PROXIES }}
          CATO_SIGNUP: ${{ vars.CATO_SIGNUP }}
          CATO_LOG_FORMAT: ${{ vars.CATO_LOG_FORMAT }}
          CATO_WIKIDATA_LINKS: ${{ vars.CATO_WIKIDATA_LINKS }}
          CATO_PUSH_CONTACT: ${{ vars.CATO_PUSH_CONTACT }}
          CATO_SMTP_HOST: ${{ vars.CATO_SMTP_HOST }}
          CATO_SMTP_PORT: ${{ vars.CATO_SMTP_PORT }}
          CATO_SMTP_USER: ${{ vars.CATO_SMTP_USER }}
          CATO_SMTP_FROM: ${{ vars.CATO_SMTP_FROM }}
          CATO_SMTP_PASSWORD: ${{ secrets.CATO_SMTP_PASSWORD }}
          CATO_METRICS_TOKEN: ${{ secrets.CATO_METRICS_TOKEN }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
          TWITCH_OAUTH_ID: ${{ secrets.TWITCH_OAUTH_ID }}
          TWITCH_OAUTH_SECRET: ${{ secrets.TWITCH_OAUTH_SECRET }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          UPCITEMDB_KEY: ${{ secrets.UPCITEMDB_KEY }}
          # The nightly backup's backup.env (scripts/backup.sh).
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          BACKUP_NOTIFY_EMAILS: ${{ secrets.BACKUP_NOTIFY_EMAILS }}
        run: bash scripts/deploy-remote.sh
