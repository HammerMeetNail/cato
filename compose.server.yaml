# Host .env holds application settings (written by the deploy from GitHub
# secrets); the deploy writes compose.yaml with the image digest in place of
# CATO_IMAGE, so the host's cato.service can run plain `podman-compose up -d`.
name: cato
services:
  cato:
    image: ${CATO_IMAGE:?Set CATO_IMAGE to a repository@sha256 digest}
    env_file: .env
    environment:
      CATO_LISTEN_ADDR: ':7080'
      CATO_DB_PATH: /app/data/cato.db
      CATO_COVER_DIR: /app/data/covers
      CATO_STATIC_DIR: /app/web/static
    ports:
      # Loopback only: the Cloudflare Tunnel reaches it at 127.0.0.1:8083.
      - '127.0.0.1:8083:7080'
    volumes:
      # :Z relabels the directory for SELinux (Fedora host).
      - ./data:/app/data:Z
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
