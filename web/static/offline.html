<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title>Cato — Offline</title>
    <style>
      :root {
        --bg: #1a1a2e;
        --surface: #16213e;
        --text: #eee;
        --accent: #e94560;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px;
      }
      .card {
        text-align: center;
        max-width: 320px;
        background: var(--surface);
        border-radius: 12px;
        padding: 32px 24px;
      }
      .icon { font-size: 64px; margin-bottom: 16px; }
      h1 { font-size: 24px; margin-bottom: 8px; color: var(--text); }
      p { color: #999; font-size: 16px; line-height: 1.5; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🎮</div>
      <h1>You're offline</h1>
      <p>Check your connection and try again. Your library is saved locally and will sync when you're back online.</p>
      <p style="margin-top:16px"><a href="/">Retry</a></p>
    </div>
  </body>
</html>
