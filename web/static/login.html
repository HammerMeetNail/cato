<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f8">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Cato: a private, fast record of the games you play.">
  <title>Sign in · Cato</title>
  <script src="/js/theme-init.js"></script>
  <script src="/js/head-init.js"></script>
  <!-- assets -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/views.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="brand"><img src="/favicon.svg" alt="" width="40" height="40">Cato</div>
      <p class="pitch" id="pitch">Your games: what you're playing, what's next and what you thought. Log a session in two taps. Private to you and the people on this server.</p>
      <h1 id="formTitle" style="font-size:var(--fs-22)">Sign in</h1>
      <div class="error-msg" id="errorMsg" role="alert"></div>
      <form id="loginForm" class="form-grid">
        <label class="field"><span>Email</span>
          <input class="input" type="email" id="email" required autocomplete="email" inputmode="email"></label>
        <label class="field"><span>Password</span>
          <input class="input" type="password" id="password" required autocomplete="current-password" minlength="8"></label>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign in</button>
      </form>
      <div class="divider" id="googleDivider" hidden>or</div>
      <button type="button" class="btn btn-secondary btn-block" id="passkeyBtn" hidden>Sign in with a passkey</button>
      <a class="btn btn-secondary btn-block" id="googleBtn" href="/api/auth/google/start" hidden style="margin-top:var(--sp-2)">Continue with Google</a>
      <p class="form-footer" id="signupFooter" hidden>
        <span id="toggleText">New here?</span>
        <button type="button" class="link" id="toggleLink">Create an account</button>
      </p>
    </div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
