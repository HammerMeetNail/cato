<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cato - Login</title>
  <script src="/js/theme-init.js"></script>
  <script src="/js/head-init.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Cato</h1>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Login</button>
      </form>

      <div class="divider">or</div>

      <button class="btn btn-google" id="googleBtn">Sign in with Google</button>

      <div class="form-footer">
        <span id="toggleText">Don't have an account?</span>
        <a id="toggleLink">Sign up</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
