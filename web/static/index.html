<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cato — Game Library</title>
  <script>try{var t=localStorage.getItem('cato-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <script src="/js/head-init.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a href="#mainContainer" class="skip-link">Skip to content</a>
  <div class="app-shell">
    <header class="topbar" id="top-bar" role="banner">
      <h1><a class="brand-link" href="/" aria-label="Cato home">Cato</a></h1>
      <nav aria-label="Account">
        <a href="/login" id="loginLink" style="display:none">Login</a>
        <div class="user-menu" id="userMenu" style="display:none">
          <button type="button" class="user-menu-btn" id="userMenuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown" hidden>
            <span class="user-menu-name" id="userDisplay"></span>
            <a href="#settings" id="settingsLink">Settings</a>
            <a href="#" id="logoutLink">Logout</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="container" id="mainContainer" aria-live="polite">
      <div id="libraryView">
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="Search games…"
                 autocomplete="off" enterkeyhint="search"
                 spellcheck="false" autocapitalize="none" autocorrect="off"
                 role="combobox" aria-expanded="false"
                 aria-autocomplete="list" aria-controls="searchResults"
                 aria-label="Search games">
          <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
          <button type="button" class="voice-btn" id="voiceBtn" aria-label="Search by voice" style="display:none">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <line x1="12" y1="18" x2="12" y2="21"></line>
            </svg>
          </button>
          <div class="search-hint" aria-hidden="true">
            <span><kbd>$</kbd> filters your library by tag, e.g. <kbd>$rpg</kbd></span>
            <span><kbd>@</kbd> filters by platform, e.g. <kbd>@switch</kbd> · tags with spaces need quotes: <kbd>$"switch 2"</kbd></span>
          </div>
          <div class="search-results" id="searchResults" role="listbox" aria-label="Search results"></div>
        </div>

        <div class="tabs" id="statusTabs" role="tablist" aria-label="Library filters">
          <button class="tab active" data-status="" role="tab" aria-selected="true">All</button>
          <button class="tab" data-status="wishlist" role="tab" aria-selected="false">Wishlist</button>
          <button class="tab" data-status="backlog" role="tab" aria-selected="false">Backlog</button>
          <button class="tab" data-status="playing" role="tab" aria-selected="false">Playing</button>
          <button class="tab" data-status="completed" role="tab" aria-selected="false">Completed</button>
          <button class="tab" data-status="abandoned" role="tab" aria-selected="false">Abandoned</button>
        </div>

        <div class="stats-strip" id="statsStrip" style="display:none" aria-live="polite"></div>

        <div class="game-grid" id="gameGrid" role="list" aria-label="Game library">
          <div class="loading" role="status" aria-live="polite">Loading library...</div>
        </div>
      </div>
      <div id="statsView" hidden></div>
      <div id="playingView" hidden></div>
      <div id="settingsView" hidden></div>
    </main>
  </div>

  <nav id="bottom-tabs" hidden aria-label="Main navigation">
    <a href="#" class="tab-item" data-nav="library" data-route="library" aria-label="Library" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
      </svg>
      <span>Library</span>
    </a>
    <a href="#now" class="tab-item" data-nav="now" data-route="now" aria-label="Now Playing">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <span>Playing</span>
    </a>
    <a href="#stats" class="tab-item" data-nav="stats" data-route="stats" aria-label="Stats">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span>Stats</span>
    </a>
    <a href="#settings" class="tab-item" data-nav="settings" data-route="settings" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- Library filter FAB — Nabu-style: icon expands to status chips + advanced filters -->
  <div class="lib-filter-fab" id="libFilterFab" hidden>
    <div class="lib-filter-panel" id="libFilterPanel" hidden></div>
    <button type="button" class="lib-filter-btn" id="libFilterBtn" aria-expanded="false" aria-controls="libFilterPanel" aria-label="Filter library">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
    </button>
    <span class="lib-filter-badge" id="libFilterBadge" hidden>0</span>
  </div>

  <!-- Mobile search shortcut: jumps to the search box (the add path). -->
  <button type="button" class="fab-add" id="fabAdd" aria-label="Search games">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="6.5"></circle>
      <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
    </svg>
  </button>

  <script type="module">
    import { checkAuth, logout, library } from '/js/api.js';
    import { initSearch, initVoiceSearch, recordRecentSearch } from '/js/search.js';
    import { loadLibrary, loadSearchResults, addGameToLibrary, getHashStatus, getHashGameId, getHashSearch, openGameModal, openLibraryItemModal, filterByTag, filterByPlatform, refreshTabCounts } from '/js/library.js';
    import { renderStatsView } from '/js/stats.js';
    import { renderSettingsView } from '/js/settings.js';
    import { renderPlayingView } from '/js/playing.js';

    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const userDisplay = document.getElementById('userDisplay');
    const loginLink = document.getElementById('loginLink');
    const userMenuBtn = document.getElementById('userMenuBtn');
    const userMenuDropdown = document.getElementById('userMenuDropdown');
    const logoutLink = document.getElementById('logoutLink');
    const settingsLink = document.getElementById('settingsLink');
    const statusTabs = document.getElementById('statusTabs');
    const bottomTabs = document.getElementById('bottom-tabs');
    const libraryView = document.getElementById('libraryView');
    const statsView = document.getElementById('statsView');
    const playingView = document.getElementById('playingView');
    const settingsView = document.getElementById('settingsView');
    const fabAdd = document.getElementById('fabAdd');
    const libFilterFab = document.getElementById('libFilterFab');
    const libFilterPanel = document.getElementById('libFilterPanel');

    function updateBottomTabs(route) {
      if (!bottomTabs) return;
      bottomTabs.querySelectorAll('.tab-item').forEach(tab => {
        const r = tab.dataset.route || '';
        const active = r === route;
        tab.classList.toggle('active', active);
        if (active) tab.setAttribute('aria-current', 'page');
        else tab.removeAttribute('aria-current');
      });
    }

    function showView(name) {
      if (libraryView) libraryView.hidden = name !== 'library';
      if (statsView) statsView.hidden = name !== 'stats';
      if (playingView) playingView.hidden = name !== 'playing';
      if (settingsView) settingsView.hidden = name !== 'settings';
      if (fabAdd) fabAdd.style.display = name === 'library' ? '' : 'none';
      if (libFilterFab) {
        if (name !== 'library') {
          libFilterFab.hidden = true;
          if (libFilterPanel) {
            libFilterPanel.hidden = true;
            libFilterPanel.classList.remove('lib-filter-panel--open');
          }
          const libFilterBtn = document.getElementById('libFilterBtn');
          if (libFilterBtn) libFilterBtn.classList.remove('lib-filter-btn--open');
        } else {
          // Library view: let library.js decide (search mode hides FAB, library mode shows)
          // Don't force hidden=false here — loadLibrary/loadSearchResults will sync.
        }
      }
      if (name !== 'library') {
        const existingModal = document.getElementById('addGameModal');
        if (existingModal) {
          existingModal.remove();
          document.body.classList.remove('modal-open');
        }
        document.getElementById('statsDialog')?.remove();
      }
    }

    async function handleRoute() {
      const raw = window.location.hash.slice(1);
      if (raw === 'stats') {
        updateBottomTabs('stats');
        showView('stats');
        await renderStatsView(statsView);
        return;
      }
      if (raw === 'now' || raw === 'now-playing' || raw === 'playing-now') {
        updateBottomTabs('now');
        showView('playing');
        await renderPlayingView(playingView);
        return;
      }
      if (raw === 'settings') {
        updateBottomTabs('settings');
        showView('settings');
        await renderSettingsView(settingsView);
        return;
      }

      updateBottomTabs('library');
      showView('library');

      const searchQuery = getHashSearch();
      if (searchQuery) {
        searchInput.value = searchQuery;
        recordRecentSearch(searchQuery);
        await loadSearchResults(searchQuery);
        return;
      }

      const status = getHashStatus();
      const gameId = getHashGameId();
      await loadLibrary(status);
      if (gameId) {
        openGameModal(gameId);
      }
    }

    // Service worker registration (PWA) – keep cache fresh, show update toast.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').then(reg => {
        window.__catoSW = reg;
      }).catch(() => {});
      let hadController = !!navigator.serviceWorker.controller;
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        if (!hadController) { hadController = true; return; }
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast toast-info';
        toast.style.cssText = 'display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;';
        const label = document.createElement('span');
        label.textContent = 'Update available';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'Refresh';
        btn.style.cssText = 'margin-left:auto;background:rgba(255,255,255,0.2);border:none;color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer;font-weight:600;';
        btn.addEventListener('click', () => { refreshing = true; window.location.reload(); });
        toast.append(label, btn);
        container.appendChild(toast);
        setTimeout(() => { if (!refreshing) toast.remove(); }, 30000);
      });
    }

    const auth = await checkAuth();

    if (!auth.authenticated) {
      window.location.href = '/login' + window.location.hash;
      throw new Error('Not authenticated');
    }

    if (auth.display_name) {
      userDisplay.textContent = auth.display_name;
    } else {
      userDisplay.style.display = 'none';
    }
    document.getElementById('userMenu').style.display = '';
    loginLink.style.display = 'none';
    if (bottomTabs) bottomTabs.hidden = false;

    function setUserMenu(open) {
      userMenuDropdown.hidden = !open;
      userMenuBtn.setAttribute('aria-expanded', String(open));
    }

    userMenuBtn.addEventListener('click', () => setUserMenu(userMenuDropdown.hidden));

    document.addEventListener('click', (e) => {
      if (!userMenuDropdown.hidden && !e.target.closest('.user-menu')) setUserMenu(false);
      // Bottom tabs are anchors; prevent full-page navigation and use SPA hash.
      const navEl = e.target.closest('#bottom-tabs .tab-item');
      if (navEl) {
        e.preventDefault();
        const route = navEl.dataset.route;
        if (route === 'library') {
          history.replaceState(null, '', window.location.pathname + window.location.search);
          handleRoute();
        } else {
          window.location.hash = '#' + route;
        }
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !userMenuDropdown.hidden) {
        e.stopPropagation();
        setUserMenu(false);
      }
    });

    if (settingsLink) {
      settingsLink.addEventListener('click', () => setUserMenu(false));
    }

    document.addEventListener('keydown', (e) => {
      if (e.key !== '/' || e.ctrlKey || e.metaKey) return;
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      e.preventDefault();
      if (libraryView.hidden) {
        window.location.hash = '';
        setTimeout(() => searchInput.focus(), 0);
      } else {
        searchInput.focus();
      }
    });

    fabAdd?.addEventListener('click', () => {
      if (libraryView.hidden) {
        window.location.hash = '';
        setTimeout(() => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
          searchInput.focus();
        }, 0);
        return;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      searchInput.focus();
    });

    const statsStrip = document.getElementById('statsStrip');
    if (statsStrip) {
      statsStrip.setAttribute('role', 'button');
      statsStrip.setAttribute('tabindex', '0');
      statsStrip.title = 'View detailed stats';
      const goStats = () => { window.location.hash = '#stats'; };
      statsStrip.addEventListener('click', goStats);
      statsStrip.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goStats(); }
      });
    }

    logoutLink.addEventListener('click', async (e) => {
      e.preventDefault();
      await logout();
      window.location.href = '/login';
    });

    initSearch(searchInput, searchResults, (game) => {
      if (game.status) {
        openLibraryItemModal(game);
      } else {
        addGameToLibrary(game);
      }
      searchInput.value = '';
      searchInput.blur();
    }, (query) => {
      if (query.startsWith('$')) {
        const tag = query.slice(1).trim();
        if (tag) {
          searchInput.value = '';
          searchInput.blur();
          recordRecentSearch(query);
          filterByTag(tag);
          return;
        }
      }
      if (query.startsWith('@')) {
        const platform = query.slice(1).trim();
        if (platform) {
          searchInput.value = '';
          searchInput.blur();
          recordRecentSearch(query);
          filterByPlatform(platform);
          return;
        }
      }
      searchInput.blur();
      window.location.hash = '#search/' + encodeURIComponent(query);
    }, async (tag) => {
      try {
        return await library.list('', 8, 0, tag);
      } catch {
        return [];
      }
    });

    initVoiceSearch(document.getElementById('voiceBtn'), searchInput);

    document.getElementById('searchClear')?.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      searchInput.dispatchEvent(new Event('input'));
    });

    searchResults.addEventListener('tagfilter', (e) => {
      recordRecentSearch('$' + e.detail.tag);
      searchInput.value = '';
      searchInput.blur();
      filterByTag(e.detail.tag);
    });

    searchResults.addEventListener('platformfilter', (e) => {
      recordRecentSearch('@' + e.detail.platform);
      searchInput.value = '';
      searchInput.blur();
      filterByPlatform(e.detail.platform);
    });

    // Status tabs: accessible tablist handling
    statusTabs.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', async () => {
        const status = tab.dataset.status || '';
        // Update aria-selected for accessibility
        statusTabs.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t === tab)));
        if (status) {
          window.location.hash = '#' + status;
        } else {
          history.replaceState(null, '', window.location.pathname + window.location.search);
          searchInput.value = '';
          await handleRoute();
        }
      });
    });

    window.addEventListener('hashchange', handleRoute);
    await handleRoute();

    // Keyboard shortcut for bottom tabs: 1=Library, 2=Playing, 3=Stats, 4=Settings
    document.addEventListener('keydown', (e) => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === '1') { e.preventDefault(); window.location.hash = ''; }
      if (e.key === '2') { e.preventDefault(); window.location.hash = '#now'; }
      if (e.key === '3') { e.preventDefault(); window.location.hash = '#stats'; }
      if (e.key === '4') { e.preventDefault(); window.location.hash = '#settings'; }
    });
  </script>
</body>
</html>
