<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cato — Game Library</title>
  <script>try{var t=localStorage.getItem('cato-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <script src="/js/head-init.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a href="#mainContainer" class="skip-link">Skip to content</a>
  <div class="app-shell">
    <header class="topbar" id="top-bar" role="banner">
      <h1><a class="brand-link" href="#now" aria-label="Cato home">Cato</a></h1>
      <nav aria-label="Search and account">
        <button type="button" class="header-search" id="fabAdd" aria-label="Search games">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
          </svg>
          <span>Search</span>
        </button>

        <a href="/login" id="loginLink" style="display:none">Login</a>
        <div class="user-menu" id="userMenu" style="display:none">
          <button type="button" class="user-menu-btn" id="userMenuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown" hidden>
            <span class="user-menu-name" id="userDisplay"></span>
            <a href="#" id="logoutLink">Logout</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="container" id="mainContainer" tabindex="-1" aria-live="polite">
      <div id="libraryView">
        <div class="search-wrap">
          <div class="search-field">
            <input type="text" id="searchInput" placeholder="Search games…"
                   autocomplete="off" enterkeyhint="search"
                   spellcheck="false" autocapitalize="none" autocorrect="off"
                   role="combobox" aria-expanded="false"
                   aria-autocomplete="list" aria-controls="searchResults"
                   aria-label="Search games">
            <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
            <button type="button" class="voice-btn" id="voiceBtn" aria-label="Search by voice" style="display:none">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3"></rect>
                <path d="M5 11a7 7 0 0 0 14 0"></path>
                <line x1="12" y1="18" x2="12" y2="21"></line>
              </svg>
            </button>
          </div>
          <div class="search-hint" aria-hidden="true">
            <span><kbd>$</kbd> filters your library by tag, e.g. <kbd>$rpg</kbd></span>
            <span><kbd>@</kbd> filters by platform, e.g. <kbd>@switch</kbd> · tags with spaces need quotes: <kbd>$"switch 2"</kbd></span>
          </div>
          <div class="search-results" id="searchResults" role="listbox" aria-label="Search results"></div>
          <!-- Filter panel uses the same controls on phones and desktop. -->
          <div class="lib-filter-panel" id="libFilterPanel" hidden></div>
        </div>

        <div class="library-toolbar" aria-label="Library controls">
          <h2>Library</h2>
          <div class="library-toolbar-actions">
            <div class="lib-filter-fab status-filter-fab" id="statusFilterFab" hidden>
              <div class="lib-filter-panel status-filter-panel" id="statusFilterPanel" hidden></div>
              <button type="button" class="lib-filter-btn" id="statusFilterBtn" aria-expanded="false" aria-controls="statusFilterPanel" aria-label="Filter by status">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4"></path><path d="M8 10v4"></path><path d="M15 11v.01"></path><path d="M18 13v.01"></path></svg>
                <span>Status</span>
              </button>
            </div>
            <button type="button" class="search-filter-btn" id="searchAdvancedBtn" aria-label="More filters" aria-expanded="false" aria-controls="libFilterPanel" title="More filters">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
              <span>Filters</span>
              <span class="lib-filter-badge" id="libFilterBadgeInline" hidden>0</span>
            </button>
          </div>
        </div>

        <div class="tabs" id="statusTabs" role="tablist" aria-label="Library filters">
          <button class="tab active" data-status="" role="tab" aria-selected="true">All</button>
          <button class="tab" data-status="wishlist" role="tab" aria-selected="false">Wishlist</button>
          <button class="tab" data-status="backlog" role="tab" aria-selected="false">Backlog</button>
          <button class="tab" data-status="playing" role="tab" aria-selected="false">Playing</button>
          <button class="tab" data-status="completed" role="tab" aria-selected="false">Completed</button>
          <button class="tab" data-status="abandoned" role="tab" aria-selected="false">Abandoned</button>
        </div>

        <div class="stats-strip" id="statsStrip" style="display:none" aria-live="polite"></div>

        <div class="game-grid" id="gameGrid" role="list" aria-label="Game library">
          <div class="loading" role="status" aria-live="polite">Loading library...</div>
        </div>
      </div>
      <div id="statsView" hidden></div>
      <div id="playingView" hidden></div>
      <div id="settingsView" hidden></div>
    </main>
  </div>

  <nav id="bottom-tabs" hidden aria-label="Main navigation">
    <a href="#library" class="tab-item" data-nav="library" data-route="library" aria-label="Library">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
      </svg>
      <span>Library</span>
    </a>
    <a href="#now" class="tab-item" data-nav="now" data-route="now" aria-label="Now Playing" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <span>Playing</span>
    </a>
    <a href="#stats" class="tab-item" data-nav="stats" data-route="stats" aria-label="Stats">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span>Stats</span>
    </a>
    <a href="#settings" class="tab-item" data-nav="settings" data-route="settings" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <div class="lib-filter-backdrop" id="libFilterBackdrop" hidden></div>
  <div class="lib-filter-backdrop status-filter-backdrop" id="statusFilterBackdrop" hidden aria-hidden="true"></div>
  <div class="search-backdrop" id="searchBackdrop" hidden></div>
  <!-- Compatibility handles for the shared library filter controller. -->
  <div class="lib-filter-fab advanced-filter-fab" id="libFilterFab" hidden style="display:none">
    <button type="button" class="lib-filter-btn" id="libFilterBtn" aria-expanded="false" aria-controls="libFilterPanel" aria-label="Filter library" hidden>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
    </button>
    <span class="lib-filter-badge" id="libFilterBadge" hidden>0</span>
  </div>


  <script type="module" src="/js/app.js"></script>
</body>
</html>
