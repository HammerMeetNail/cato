<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cato - Game Library</title>
  <script>try{var t=localStorage.getItem('cato-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>Cato</h1>
      <nav>
        <span id="userDisplay"></span>
        <a href="/login" id="loginLink">Login</a>
        <a href="#" id="logoutLink" style="display:none">Logout</a>
      </nav>
    </header>

    <main class="container">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search games…"
               autocomplete="off" enterkeyhint="search"
               spellcheck="false" autocapitalize="none" autocorrect="off"
               role="combobox" aria-expanded="false"
               aria-autocomplete="list" aria-controls="searchResults">
        <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
        <button type="button" class="voice-btn" id="voiceBtn" aria-label="Search by voice" style="display:none">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="18" x2="12" y2="21"></line>
          </svg>
        </button>
        <div class="search-hint">
          <span><kbd>$</kbd> filters your library by tag, e.g. <kbd>$rpg</kbd></span>
          <span><kbd>@</kbd> filters by platform, e.g. <kbd>@switch</kbd> · tags with spaces need quotes: <kbd>$"switch 2"</kbd></span>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="tabs" id="statusTabs">
        <button class="tab active" data-status="">All</button>
        <button class="tab" data-status="wishlist">Wishlist</button>
        <button class="tab" data-status="backlog">Backlog</button>
        <button class="tab" data-status="playing">Playing</button>
        <button class="tab" data-status="completed">Completed</button>
        <button class="tab" data-status="abandoned">Abandoned</button>
      </div>

      <div class="stats-strip" id="statsStrip" style="display:none"></div>

      <div class="game-grid" id="gameGrid">
        <div class="loading">Loading library...</div>
      </div>
    </main>
  </div>

  <!-- Mobile search shortcut: jumps to the search box (the add path). -->
  <button type="button" class="fab-add" id="fabAdd" aria-label="Search games">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="6.5"></circle>
      <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
    </svg>
  </button>

  <script type="module">
    import { checkAuth, logout, library } from '/js/api.js';
    import { initSearch, initVoiceSearch, recordRecentSearch } from '/js/search.js';
    import { loadLibrary, loadSearchResults, addGameToLibrary, renderLibraryItems, getHashStatus, getHashGameId, getHashSearch, openGameModal, activateStatusTab, openLibraryItemModal, filterByTag, filterByPlatform, refreshTabCounts, loadHero, initHeroActions } from '/js/library.js';
    import { openStatsDialog } from '/js/stats.js';

    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const userDisplay = document.getElementById('userDisplay');
    const loginLink = document.getElementById('loginLink');
    const logoutLink = document.getElementById('logoutLink');
    const statusTabs = document.getElementById('statusTabs');

    async function handleRoute() {
      const searchQuery = getHashSearch();
      if (searchQuery) {
        searchInput.value = searchQuery;
        recordRecentSearch(searchQuery);
        await loadSearchResults(searchQuery);
        return;
      }

      const status = getHashStatus();
      const gameId = getHashGameId();
      await loadLibrary(status);
      if (gameId) {
        openGameModal(gameId);
      }
    }

    const initialSearch = getHashSearch();
    const initialStatus = getHashStatus();
    const initialGameId = getHashGameId();

    // Fire auth check and library fetch simultaneously so neither waits for
    // the other.  On a fresh page load this cuts the visible wait time from
    // sum(auth + library) to roughly max(auth, library).
    // library.list() will return a 401 for unauthenticated users; we catch
    // that so it doesn't surface as an unhandled rejection.
    const [auth, lib] = await Promise.all([
      checkAuth(),
      initialSearch ? null : library.list(initialStatus).catch(() => null),
    ]);

    if (!auth.authenticated) {
      window.location.href = '/login' + window.location.hash;
      throw new Error('Not authenticated');
    }

    userDisplay.textContent = auth.display_name || auth.email || '';
    loginLink.style.display = 'none';
    logoutLink.style.display = 'inline';

    // "Playing now" strip: one-tap time logging + finish. Handlers are
    // delegated inside library.js; this just arms them once.
    initHeroActions();

    // "/" focuses search from anywhere (unless typing in a field).
    document.addEventListener('keydown', (e) => {
      if (e.key !== '/' || e.ctrlKey || e.metaKey) return;
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      e.preventDefault();
      searchInput.focus();
    });

    // Mobile "+" jumps to the search box.
    document.getElementById('fabAdd')?.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      searchInput.focus();
    });

    // The stats strip doubles as the entry point to the stats dialog.
    const statsStrip = document.getElementById('statsStrip');
    if (statsStrip) {
      statsStrip.setAttribute('role', 'button');
      statsStrip.setAttribute('tabindex', '0');
      statsStrip.title = 'View detailed stats';
      const openStats = () => openStatsDialog();
      statsStrip.addEventListener('click', openStats);
      statsStrip.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openStats(); }
      });
    }

    logoutLink.addEventListener('click', async (e) => {
      e.preventDefault();
      await logout();
      window.location.href = '/login';
    });

    // Search
    initSearch(searchInput, searchResults, (game) => {
      // If game has a status field, it's a library item (tag search result) —
      // open the edit modal instead of the add modal.
      if (game.status) {
        openLibraryItemModal(game);
      } else {
        addGameToLibrary(game);
      }
      searchInput.value = '';
    }, (query) => {
      if (query.startsWith('$')) {
        const tag = query.slice(1).trim();
        if (tag) {
          searchInput.value = '';
          filterByTag(tag);
          return;
        }
      }
      if (query.startsWith('@')) {
        const platform = query.slice(1).trim();
        if (platform) {
          searchInput.value = '';
          filterByPlatform(platform);
          return;
        }
      }
      window.location.hash = '#search/' + encodeURIComponent(query);
    }, async (tag) => {
      try {
        return await library.list('', 8, 0, tag);
      } catch {
        return [];
      }
    });

    // Voice search (progressive enhancement — button removes itself when the
    // Web Speech API is unavailable).
    initVoiceSearch(document.getElementById('voiceBtn'), searchInput);

    // In-input clear button: empties the box, refocuses, and re-shows the
    // recent searches panel.
    document.getElementById('searchClear')?.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      searchInput.dispatchEvent(new Event('input'));
    });

    // Listen for tagfilter events from search.js ($tag Enter or "Filter library" click)
    searchResults.addEventListener('tagfilter', (e) => {
      searchInput.value = '';
      filterByTag(e.detail.tag);
    });

    // Listen for platformfilter events from search.js (@platform Enter or footer)
    searchResults.addEventListener('platformfilter', (e) => {
      searchInput.value = '';
      filterByPlatform(e.detail.platform);
    });

    // Status tabs
    statusTabs.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', async () => {
        const status = tab.dataset.status || '';
        if (status) {
          window.location.hash = '#' + status;
        } else {
          history.replaceState(null, '', window.location.pathname + window.location.search);
          searchInput.value = '';
          await handleRoute();
        }
      });
    });

    // Render with already-loaded data; fall back to a fresh fetch if the
    // parallel request failed for a non-auth reason (e.g. transient error).
    if (initialSearch) {
      searchInput.value = initialSearch;
      await loadSearchResults(initialSearch);
    } else {
      activateStatusTab(initialStatus);
      refreshTabCounts();
      if (lib !== null) {
        renderLibraryItems(lib.items, initialStatus);
      } else {
        loadLibrary(initialStatus);
      }

      if (initialGameId) {
        openGameModal(initialGameId);
      }
    }

    window.addEventListener('hashchange', handleRoute);
  </script>
</body>
</html>
