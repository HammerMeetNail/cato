version: '3.4'
services:
  cato:
    container_name: cato
    build: .
    ports:
      - "7080:7080"
    volumes:
      - ./data:/app/data
    environment:
      - CATO_LISTEN_ADDR=:7080
      - CATO_BASE_URL=${CATO_BASE_URL:-}
      - CATO_SECURE_COOKIES=${CATO_SECURE_COOKIES:-false}
      - IGDB_CLIENT_ID=${TWITCH_OAUTH_ID:-}
      - IGDB_CLIENT_SECRET=${TWITCH_OAUTH_SECRET:-}
      - TWITCH_OAUTH_ID=${TWITCH_OAUTH_ID:-}
      - TWITCH_OAUTH_SECRET=${TWITCH_OAUTH_SECRET:-}
      - GOOGLE_KEY=${GOOGLE_KEY:-}
      - GOOGLE_SECRET=${GOOGLE_SECRET:-}
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
