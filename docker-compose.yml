version: '3.4'
services:
  cato:
    container_name: cato
    build: .
    ports:
      - "7080:7080"
    volumes:
      - ./data:/app/data
    environment:
      - CATO_LISTEN_ADDR=:7080
      - CATO_BASE_URL=${CATO_BASE_URL:-}
      - CATO_SECURE_COOKIES=${CATO_SECURE_COOKIES:-false}
      # Cato is HTTPS-only: set CATO_BASE_URL=https://… behind a TLS proxy,
      # or CATO_TLS_CERT_FILE/KEY_FILE (paths inside /app/data), or
      # CATO_DEV_TLS=1. Plain HTTP refuses to start without CATO_ALLOW_INSECURE=1.
      - CATO_TLS_CERT_FILE=${CATO_TLS_CERT_FILE:-}
      - CATO_TLS_KEY_FILE=${CATO_TLS_KEY_FILE:-}
      - CATO_DEV_TLS=${CATO_DEV_TLS:-}
      - CATO_DEV_TLS_DIR=/app/data/dev-tls
      - CATO_TRUSTED_PROXIES=${CATO_TRUSTED_PROXIES:-}
      - CATO_ALLOW_INSECURE=${CATO_ALLOW_INSECURE:-}
      - CATO_SIGNUP=${CATO_SIGNUP:-closed}
      - IGDB_CLIENT_ID=${TWITCH_OAUTH_ID:-}
      - IGDB_CLIENT_SECRET=${TWITCH_OAUTH_SECRET:-}
      - TWITCH_OAUTH_ID=${TWITCH_OAUTH_ID:-}
      - TWITCH_OAUTH_SECRET=${TWITCH_OAUTH_SECRET:-}
      - GOOGLE_KEY=${GOOGLE_KEY:-}
      - GOOGLE_SECRET=${GOOGLE_SECRET:-}
      - CATO_METRICS_TOKEN=${CATO_METRICS_TOKEN:-}
      - CATO_LOG_FORMAT=${CATO_LOG_FORMAT:-text}
      - CATO_BACKUP_DIR=${CATO_BACKUP_DIR:-}
      - CATO_WIKIDATA_LINKS=${CATO_WIKIDATA_LINKS:-}
      - STEAM_WEB_API_KEY=${STEAM_WEB_API_KEY:-}
      - ITAD_API_KEY=${ITAD_API_KEY:-}
      - UPCITEMDB_KEY=${UPCITEMDB_KEY:-}
      - CATO_PUSH_CONTACT=${CATO_PUSH_CONTACT:-}
      - CATO_SMTP_HOST=${CATO_SMTP_HOST:-}
      - CATO_SMTP_PORT=${CATO_SMTP_PORT:-587}
      - CATO_SMTP_USER=${CATO_SMTP_USER:-}
      - CATO_SMTP_PASSWORD=${CATO_SMTP_PASSWORD:-}
      - CATO_SMTP_FROM=${CATO_SMTP_FROM:-}
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
